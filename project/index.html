<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terima kasih dari hati bukan AI(Asli Ini)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page-index" class="page page-fadein">

  <main class="vh-100 d-flex align-items-center justify-content-center bg-soft">
    <div class="container text-center">
      <img src="assets/anya2.png" alt="">
      <h1 class="display-4 fw-400 mb-4 greeting">Hehe</h1>
      <button id="openLetterBtn" class="envelope-btn" aria-label="Buka surat">
        <img src="assets/envelope-removebg-preview.png" alt="Envelope Button" class="envelope-img">
          <defs>
            <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#f8fafc"/>
              <stop offset="1" stop-color="#e6f4ff"/>
            </linearGradient>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9fb7d9" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- envelope body -->
          <rect x="6" y="14" rx="8" ry="8" width="108" height="52" fill="url(#g1)" stroke="#dbeefc" stroke-width="1.5" filter="url(#soft)"/>
          <!-- flap -->
          <path d="M6 14 L60 42 L114 14 Z" fill="#dceffb" stroke="#c3e5fb" stroke-width="1"/>
          <!-- inner paper hint -->
          <rect x="16" y="22" width="88" height="36" rx="5" ry="5" fill="#fff" opacity="0.9"/>
          <!-- little heart -->
          <path d="M60 38 c-2 -3 -6 -6 -10 -6 c-5 0 -9 4 -9 9 c0 5 4 9 9 9 c3 0 6 -2 8 -4 c2 2 5 4 8 4 c5 0 9 -4 9 -9 c0 -5 -4 -9 -9 -9 c-4 0 -8 3 -10 6z"
                fill="#ff9fb1" opacity="0.95"/>
        </svg>
      </button>

      <p class="mt-4 lead text-muted">Kakak udah siap belum nih, kalo udah klik suratnya</p>
      <p class="mt-1 lead text-muted">Kalau bisa bukaknya di laptop kak, aku belum belajar bikin web responsive di multi device hehe</p>
      <p class="mt-4 lead text-muted">AI ? , udah limit kak 😭 </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
